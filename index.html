<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linea Pantheon - Premium Fashion & Lifestyle E-commerce</title>
    <meta
      name="description"
      content="Discover our curated collection of premium fashion and lifestyle products. Shop the latest trends with fast shipping, easy returns, and exceptional customer service."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://linea.studio21.studio/" />
    <meta
      property="og:title"
      content="Linea Pantheon - Premium Fashion & Lifestyle E-commerce"
    />
    <meta
      property="og:description"
      content="Discover our curated collection of premium fashion and lifestyle products. Shop the latest trends with fast shipping, easy returns, and exceptional customer service."
    />
    <meta
      property="og:image"
      content="https://linea.studio21.studio/opengraph-image.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://linea.studio21.studio/" />
    <meta
      property="twitter:title"
      content="Linea Pantheon - Premium Fashion & Lifestyle E-commerce"
    />
    <meta
      property="twitter:description"
      content="Discover our curated collection of premium fashion and lifestyle products. Shop the latest trends with fast shipping, easy returns, and exceptional customer service."
    />
    <meta
      property="twitter:image"
      content="https://linea.studio21.studio/opengraph-image.png"
    />

    <!-- SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="author" content="Linea Pantheon" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Linea Pantheon",
        "url": "https://linea.studio21.studio",
        "logo": "https://linea.studio21.studio/logo.png",
        "description": "Premium fashion and lifestyle e-commerce platform",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+1-555-123-4567",
          "contactType": "customer service",
          "availableLanguage": "English"
        },
        "sameAs": [
          "https://facebook.com/lineapantheon",
          "https://instagram.com/lineapantheon",
          "https://twitter.com/lineapantheon"
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Linea Pantheon",
        "url": "https://linea.studio21.studio",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://linea.studio21.studio/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
